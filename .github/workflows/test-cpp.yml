name: test-cpp

permissions: {}

on:
  push:
    branches:
      - main
      - renovate/**
    paths:
      - cpp/**
      - Makefile
      - testdata/**
      - .github/**
  pull_request:
    # branches:
    #   - main
    paths:
      - cpp/**
      - Makefile
      - testdata/**
      - .github/**

jobs:
  test-cpp-system-packages-linux:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-24.04, cxx: g++, version: 12 }
          - { os: ubuntu-24.04, cxx: g++, version: 13 }
          - { os: ubuntu-26.04, cxx: g++, version: 14 }
          - { os: ubuntu-26.04, cxx: g++, version: 15 }
          - { os: ubuntu-24.04, cxx: clang++, version: 16 }
          - { os: ubuntu-24.04, cxx: clang++, version: 17 }
          - { os: ubuntu-26.04, cxx: clang++, version: 21 }
          - { os: ubuntu-26.04, cxx: clang++, version: 22 }
    env:
      CCX: ${{ matrix.config.cxx }}-${{ matrix.config.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ github.job }}-${{ matrix.config.os }}-${{ matrix.config.cxx }}-${{ matrix.config.version }}-${{ github.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nlohmann-json3-dev libgtest-dev libgmock-dev

      - name: Build and unit test
        working-directory: cpp
        run: |
          cmake --workflow --preset test-system

      - name: Install
        working-directory: cpp
        run: |
          sudo cmake --install build/test-system

      - name: Test installation
        working-directory: cpp/test_install
        run: |
          cmake -S . -B build
          cmake --build build
          ctest --test-dir build --output-on-failure

  test-cpp-system-packages-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install build tools
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install dependencies
        shell: pwsh
        run: |
          vcpkg install nlohmann-json gtest --triplet x64-windows
          # Expose the vcpkg toolchain so find_package() locates the packages.
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

      - name: Build and unit test
        working-directory: cpp
        run: |
          cmake --workflow --preset test-system

      - name: Install
        working-directory: cpp
        run: |
          cmake --install build/test-system

      - name: Test installation
        working-directory: cpp/test_install
        run: |
          cmake -S . -B build
          cmake --build build
          ctest --test-dir build --output-on-failure

  test-cpp-system-packages-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ github.job }}-${{ github.ref }}

      - name: Install dependencies
        run: |
          brew install nlohmann-json googletest

      - name: Build and unit test
        working-directory: cpp
        run: |
          cmake --workflow --preset test-system

      - name: Install
        working-directory: cpp
        run: |
          sudo cmake --install build/test-system

      - name: Test installation
        working-directory: cpp/test_install
        run: |
          cmake -S . -B build
          cmake --build build
          ctest --test-dir build --output-on-failure

  test-cpp-conan:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install build tools (windows)
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ github.job }}-${{ matrix.os }}-${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install Conan
        run: python -m pip install --upgrade "conan>=2,<3"

      - name: Build and unit test
        working-directory: cpp
        run: |
          cmake --workflow --preset test-conan

      - name: Install (as conan package)
        working-directory: cpp
        run: |
          conan create .

      - name: Test (as conan package)
        working-directory: cpp/test_install
        run: |
          conan build .

